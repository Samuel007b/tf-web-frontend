<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contato e WhatsApp do Restaurante Dona Cida, em Fruta de Leite (MG)." />
    <title>Contato | Restaurante Dona Cida</title>
    <link rel="icon" type="image/png" href="img/icone-tudo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Didact+Gothic&family=Gelasio:wght@400;600&family=Italianno&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="tema-verde">
    <main class="pagina">
      <header class="titulo-caixa ">
        <a class="logo-link" href="index.html" aria-label="Voltar ao início">
          <img src="img/seta.gif" alt="Seta de Retorno Personalizada" width="56" height="61" />
        </a>
        <h1>Contato</h1>
      </header>

      <div class="grupo-pills contato-links">
        <a class="pill pill-whats" id="link-whatsapp" href="#" target="_blank" rel="noopener noreferrer">
          <img class="pill-icone com-borda" src="img/icone-whatsapp.png" alt="" />
          <span class="pill-texto">Faça seu pedido</span>
        </a>
        <a class="pill pill-rosa" id="link-instagram" href="#" target="_blank" rel="noopener noreferrer">
          <img class="pill-icone com-borda" src="img/icone-instagram.svg" alt="" />
          <span class="pill-texto">Instagram</span>
        </a>
      </div>

      <section class="pagina-instagram" aria-labelledby="titulo-pagina">
        <h2 id="titulo-pagina">
          <img src="img/rabisco.png" alt="" />
          Conheça nossa página
          <img class="espelho" src="img/rabisco.png" alt="" />
        </h2>
        <div class="posts" id="posts"></div>
      </section>
    </main>

    <footer class="rodape">
      <p>&copy; 2026 Restaurante Dona Cida · Fruta de Leite, MG</p>
      <p>&copy; Desenvolvido por: Athos Silvano, Lucas Inácio, Ryanderson Henzyo, Samuel Miranda &amp; Sara Augusta</p>
    </footer>

    <script type="module" src="js/contato.js"></script>
